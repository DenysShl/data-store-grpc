spring:
  application:
    name: data-store-grpc

  config:
    import: optional:file:.env[.properties]

  datasource:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      url: ${REDIS_URL}${REDIS_HOST}:${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      driver-class-name: org.redisson.RedissonDriver


server:
  port: 8083

grpc:
  client:
    GLOBAL:
      address: ${GRPC_HOST}:${GRPC_PORT}
      negotiation-type: plaintext

fetch:
  batch-size: ${BATCH_SIZE:10}